name: Compilar mod

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Compilar
        run: |
          chmod +x ./gradlew
          ./gradlew build --stacktrace

      - name: Subir .jar como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: infeccion-mod
          path: build/libs/infeccion-*.jar

      - name: Publicar Release con el .jar
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Infección - build ${{ github.run_number }} (${{ github.ref_name }})
          target_commitish: ${{ github.sha }}
          body: |
            Mod **Infección** para Minecraft **1.21.1** (Fabric).

            1. Instala Fabric Loader 0.16+ para 1.21.1.
            2. Copia `infeccion-*.jar` (el que NO termina en `-sources`) y Fabric API a la carpeta `mods`.
          files: build/libs/infeccion-*.jar
